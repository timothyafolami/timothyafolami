name: Rebuild README

on:
  schedule:
    - cron: "17 5 * * *"      # daily, 05:17 UTC
  push:
    branches: [main]
    paths:
      - "README.template.md"
      - "scripts/build_readme.py"
      - ".github/workflows/readme.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_readme.py

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain README.md assets/stats.svg)" ]]; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "readme-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/stats.svg
          git commit -m "chore: rebuild README from live data"
          git push
